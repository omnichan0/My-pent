services:
  pgvector:
    environment:
      PENTAGI_POSTGRES_USER: ${PENTAGI_POSTGRES_USER:-postgres}

  pentagi:
    environment:
      LLM_SERVER_URL: http://llama-server:8080/v1
      LLM_SERVER_KEY: local-llama.cpp
      LLM_SERVER_MODEL: G9v3-3B-Heretic-Abliterated-Q8_0.gguf
      LLM_SERVER_PROVIDER: llamacpp
      LLM_SERVER_API_TYPE: openai
      LLM_SERVER_CONFIG_PATH: /opt/pentagi/conf/llama.cpp.provider.yml
      EMBEDDING_PROVIDER: openai
      EMBEDDING_URL: http://llama-embedder:8080/v1
      EMBEDDING_KEY: local-llama.cpp
      EMBEDDING_MODEL: nomic-embed-text-v1.5.Q4_K_M.gguf
    depends_on:
      llama-server:
        condition: service_healthy
      llama-embedder:
        condition: service_healthy
    volumes:
      - ./llama.cpp.provider.yml:/opt/pentagi/conf/llama.cpp.provider.yml:ro
      - ./llama-smoke.yml:/opt/pentagi/conf/llama-smoke.yml:ro

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - --model
      - /models/G9v3-3B-Heretic-Abliterated-Q8_0.gguf
      - --alias
      - G9v3-3B-Heretic-Abliterated-Q8_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --parallel
      - "1"
      - --threads
      - "${LLAMA_CPP_THREADS:-4}"
      - --n-predict
      - "2048"
    volumes:
      - ./models:/models:ro
    expose:
      - "8080"
    networks:
      - pentagi-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  llama-embedder:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - --model
      - /models/nomic-embed-text-v1.5.Q4_K_M.gguf
      - --embedding
      - --pooling
      - mean
      - --embd-normalize
      - "2"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "2048"
      - --parallel
      - "1"
      - --threads
      - "${LLAMA_EMBEDDING_THREADS:-2}"
    volumes:
      - ./models:/models:ro
    expose:
      - "8080"
    networks:
      - pentagi-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 15s
